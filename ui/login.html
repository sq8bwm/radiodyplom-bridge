  Strona logowania do interfejsu w przeglądarce.

  Samodzielna i celowo minimalna: nie ładuje renderer.js ani strings.js, bo
  przed zalogowaniem nie ma do czego — a im mniej kodu przed bramką, tym mniej
  powierzchni. Dwujęzyczna napisami obok siebie, żeby nie ciągnąć słownika.
-->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadioDyplom Bridge — logowanie</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9; --panel: #fff; --line: #e2e6ec; --text: #1e2430;
    --muted: #6b7480; --err: #c0392b; --accent: #2c3e50; --on-accent: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg:#161a20; --panel:#1e242c; --line:#2c343e; --text:#e6eaf0;
      --muted:#98a2af; --err:#f0736a; --accent:#8ab4f8; --on-accent:#10151c;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text);
         font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; }
  .karta { background:var(--panel); border:1px solid var(--line); border-radius:10px;
           padding:24px; width:100%; max-width:380px; }
  h1 { font-size:16px; margin:0 0 4px; }
  .pod { color:var(--muted); font-size:12px; margin:0 0 18px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  input { width:100%; padding:9px 10px; font:inherit; color:var(--text);
          background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  button { width:100%; margin-top:14px; padding:10px; font:inherit; font-weight:600;
           cursor:pointer; background:var(--accent); color:var(--on-accent);
           border:none; border-radius:6px; }
  button[disabled] { opacity:.6; cursor:default; }
  /* Pole hasła z podglądem. Przycisk musi wyłamać się z `width:100%` powyżej,
     bo tamta reguła jest pisana pod przycisk „Zaloguj". */
  .pole { display:flex; gap:6px; align-items:stretch; }
  .pole input { flex:1 1 auto; min-width:0; }
  .oko { width:auto; margin:0; padding:0 10px; background:var(--panel); color:var(--muted);
         border:1px solid var(--line); border-radius:6px; display:flex; align-items:center; }
  .oko svg { width:18px; height:18px; display:block; }
  .blad { color:var(--err); font-size:13px; margin-top:12px; min-height:19px; }
  .nota { color:var(--muted); font-size:11px; margin-top:16px; border-top:1px solid var(--line);
          padding-top:12px; }
</style>
</head>
<body>
  <form class="karta" id="f" autocomplete="on">
    <h1>RadioDyplom Bridge</h1>
    <p class="pod">Logowanie do interfejsu &middot; Sign in</p>

    <label for="p">Hasło &middot; Password</label>
    <div class="pole">
      <input type="password" id="p" name="password" autocomplete="current-password" required autofocus>
      <button type="button" class="oko" id="o" aria-pressed="false"></button>
    </div>

    <button type="submit" id="b">Zaloguj &middot; Sign in</button>
    <div class="blad" id="e" role="alert"></div>

    <p class="nota" id="n"></p>
  </form>

<script>
  const f = document.getElementById('f');
  const p = document.getElementById('p');
  const b = document.getElementById('b');
  const e = document.getElementById('e');
  const o = document.getElementById('o');

  // Podgląd wpisywanego hasła. Na telefonie, gdzie klawiatura nie pokazuje
  // znaku po wpisaniu, pomyłka w długim haśle wygląda jak zła konfiguracja.
  const OKO = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">'
    + '<path d="M1 8s2.6-4.2 7-4.2S15 8 15 8s-2.6 4.2-7 4.2S1 8 1 8z"/><circle cx="8" cy="8" r="1.9"/></svg>';
  const OKO_PRZEKRESLONE = OKO.replace('</svg>', '<path d="M2.5 13.5 13.5 2.5"/></svg>');
  const rysujOko = () => {
    const widoczne = p.type === 'text';
    o.innerHTML = widoczne ? OKO_PRZEKRESLONE : OKO;
    o.title = widoczne ? 'Ukryj hasło · Hide password' : 'Pokaż hasło · Show password';
    o.setAttribute('aria-label', o.title);
    o.setAttribute('aria-pressed', String(widoczne));
  };
  o.onclick = () => {
    p.type = p.type === 'password' ? 'text' : 'password';
    rysujOko();
    p.focus();
  };
  rysujOko();

  // Informacja o trybie pracy. /api/session jest dostępne bez logowania
  // i celowo nie zdradza niczego poza tym, w jakim trybie stoi mostek.
  fetch('/api/session').then((r) => r.json()).then((s) => {
    const cz = [];
    if (s.siec) cz.push('Interfejs widoczny w sieci &middot; exposed on the network');
    if (s.tylkoOdczyt) cz.push('Tryb tylko do odczytu &middot; read-only');
    if (s.siec && !s.tls) cz.push('<strong>Bez szyfrowania</strong> &middot; not encrypted');
    document.getElementById('n').innerHTML = cz.join('<br>');
  }).catch(() => {});

  f.onsubmit = async (ev) => {
    ev.preventDefault();
    e.textContent = '';
    b.disabled = true;
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: p.value }),
      });
      if (r.ok) { location.replace('/'); return; }
      const d = await r.json().catch(() => ({}));
      // 429 niesie już gotowy komunikat z czasem blokady.
      e.textContent = d.error || (r.status === 401 ? 'Błędne hasło · Wrong password' : `Błąd ${r.status}`);
    } catch (err) {
      e.textContent = 'Brak połączenia z mostkiem · Bridge unreachable';
    } finally {
      b.disabled = false;
      p.select();
    }
  };
</script>
</body>
</html>
