<html lang="pl">
<head>
<meta charset="utf-8">
<!-- `connect-src 'self'` jest potrzebne WYŁĄCZNIE w przeglądarce: strona woła
     wtedy własne API pod tym samym adresem. W Electronie most idzie przez IPC
     i nic się nie pobiera, więc to nic tam nie rozluźnia. Bez tego `default-src
     'none'` blokował fetch i okno rysowało się puste — bez żadnego widocznego
     błędu, bo blokada CSP nie wywala strony. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self';">
<title>RadioDyplom Bridge</title>
<style>
  /* Motyw: trzy stany — „jak w systemie" (bez atrybutu), jasny i ciemny.
     Ciemna paleta jest wypisana DWA razy, świadomie: raz dla wyboru jawnego
     (data-theme="dark"), raz dla pierwszego malowania strony, zanim renderer
     wczyta konfigurację i ustawi atrybut. Bez tej drugiej kopii okno mrugałoby
     na biało przy każdym starcie na ciemnym systemie.
     `color-scheme` dokłada to, czego nie ustawimy zmiennymi: paski przewijania,
     pola formularzy i menu kontekstowe. */
  :root {
    color-scheme: light;
    --on-accent: #fff;
    --bg: #f6f7f9; --panel: #fff; --line: #e2e6ec; --text: #1e2430;
    --muted: #6b7480; --ok: #1c9d5b; --warn: #b8860b; --err: #c0392b; --accent: #2c3e50;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --on-accent: #10151c;
    --bg:#161a20; --panel:#1e242c; --line:#2c343e; --text:#e6eaf0;
    --muted:#98a2af; --ok:#3ecf8e; --warn:#e3b341; --err:#f0736a; --accent:#8ab4f8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
      --on-accent: #10151c;
      --bg:#161a20; --panel:#1e242c; --line:#2c343e; --text:#e6eaf0;
      --muted:#98a2af; --ok:#3ecf8e; --warn:#e3b341; --err:#f0736a; --accent:#8ab4f8;
    }
  }
  * { box-sizing: border-box; }
  /* `hidden` MUSI ukrywać — także wtedy, gdy klasa elementu ustawia `display`.
     Reguła przeglądarki `[hidden]{display:none}` przegrywa z KAŻDĄ regułą
     autora, więc `display:inline-flex` na `.icon-btn` zostawiał w nagłówku
     pustą obwiedzioną ramkę zamiast schowanej ikony (zgłoszone 2026-09-07).
     Ten sam problem załatano wcześniej punktowo dla okienka pytań
     (`.ask[hidden]`) — jedna reguła zamyka go raz dla wszystkiego, zamiast
     czekać na kolejny element z własnym `display`. */
  [hidden] { display: none !important; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; flex-wrap:wrap;
           border-bottom:1px solid var(--line); background:var(--panel); }
  /* Nagłówek ma sporo kontrolek — nic nie może się łamać w środku wyrazu.
     Przy wąskim oknie cały pasek zawija się w całości, a nie etykiety. */
  h1 { font-size:15px; margin:0; font-weight:600; white-space:nowrap; }
  header button, header select { white-space:nowrap; flex:none; }
  #profile { overflow:hidden; text-overflow:ellipsis; max-width:38ch; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
  .grow { flex:1; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; border:1px solid var(--line);
           color:var(--muted); font-weight:500; white-space:nowrap; }
  /* Ikona nasłuchu w sieci: kolor niesie stan, kształt niesie szczegół.
     Otwarta kłódka i czerwień = można zapisywać z sieci; zamknięta i zieleń =
     tylko odczyt. Kursor pomocy, bo klik nic nie robi — informacja jest
     w dymku. */
  button.icon-btn.net { cursor:help; color:var(--ok);
                        border-color:color-mix(in srgb, var(--ok) 55%, var(--line)); }
  button.icon-btn.net.zapis { color:var(--err);
                        border-color:color-mix(in srgb, var(--err) 60%, var(--line));
                        background:color-mix(in srgb, var(--err) 10%, transparent); }
  .badge.upd { background:color-mix(in srgb, var(--warn) 18%, transparent);
               color:var(--warn); border-color:var(--warn); }
  .badge.dry { color:var(--warn); border-color:var(--warn); }
  /* Stan łączności – te same kolory co ikona w zasobniku */
  .badge.st-ok    { color:var(--ok);   border-color:var(--ok);   background:color-mix(in srgb, var(--ok) 10%, transparent); }
  .badge.st-warn  { color:var(--warn); border-color:var(--warn); background:color-mix(in srgb, var(--warn) 12%, transparent); }
  .badge.st-error { color:var(--err);  border-color:var(--err);  background:color-mix(in srgb, var(--err) 12%, transparent); }
  select.lang { width:auto; font-size:12px; padding:3px 6px; }
  /* Przyciski ikonowe w nagłówku (motyw, język). Ikony są wbudowanymi SVG,
     a nie emoji: flagi państw NIE renderują się jako flagi na Windowsie —
     Segoe UI Emoji pokazuje wtedy litery „PL"/„GB", więc przycisk wyglądałby
     inaczej u większości odbiorców tego programu. */
  button.icon-btn { display:inline-flex; align-items:center; justify-content:center;
                    width:30px; height:26px; padding:0; cursor:pointer;
                    background:var(--panel); color:var(--text);
                    border:1px solid var(--line); border-radius:6px; }
  button.icon-btn:hover { border-color:var(--accent); }
  button.icon-btn:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button.icon-btn svg { width:16px; height:16px; display:block; }
  /* Przyciski zawijają się CAŁĄ GRUPĄ, nie pojedynczo. Przy wąskim oknie
     „Zakończ" trafiał inaczej dokładnie pod plakietki na górze — a to jedyny
     przycisk w nagłówku, który przerywa przekazywanie QSO. */
  /* Stała szerokość obu przycisków w nagłówku.
     Bez niej przesuwały się przy KAŻDEJ zmianie napisu: „Wstrzymaj" ↔ „Wznów"
     w tym samym języku i „Wstrzymaj" ↔ „Pause" przy przełączeniu na angielski.
     Wtedy skakały też ikony obok, a klikając dwa razy w to samo miejsce można
     było trafić w „Zakończ" zamiast we „Wznów”.
     Wartości dobrane pod najdłuższe napisy („Wstrzymaj", „Zakończ") i sprawdzone
     w obu językach — nie w em, bo tekst przycisków ma własny font-size. */
  header #btnPause { min-width:104px; }
  header #btnQuit  { min-width:92px; }
  .hdr-actions { display:flex; align-items:center; gap:8px; flex:none;
                 /* Do prawej krawędzi także po zawinięciu — dzięki temu
                    „Zakończ" nigdy nie stoi pod plakietkami z lewej. */
                 margin-left:auto; }
  .hdr-sep { width:1px; height:22px; background:var(--line); flex:none; }
  /* Nagłówek i zakładki przyklejone RAZEM, jednym pojemnikiem.
     Osobne `top` dla zakładek byłoby kruche: nagłówek zawija się przy wąskim
     oknie, więc jego wysokość nie jest stała.
     `z-index` jest tu KONIECZNY, nie kosmetyczny: paski statystyk mają
     `position:relative`, a element pozycjonowany później w dokumencie maluje
     się NAD przyklejonym, gdy oba mają `z-index:auto` — i przy przewinięciu
     statystyk paski wchodziły na nagłówek (zgłoszone 2026-09-07).
     Zakładki dostają własne tło: bez niego treść przejeżdżałaby pod nimi. */
  .topbar { position:sticky; top:0; z-index:20; }
  nav { display:flex; gap:4px; padding:8px 16px 0; background:var(--bg);
        border-bottom:1px solid var(--line); }
  nav button { background:none; border:none; border-bottom:2px solid transparent; color:var(--muted);
               padding:6px 12px; cursor:pointer; font-size:13px; }
  nav button.active { color:var(--text); border-bottom-color:var(--accent); }
  main { padding:16px; }
  section { display:none; } section.active { display:block; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .card .k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .card .v { font-size:22px; font-weight:600; margin-top:2px; }
  /* Druga linia karty: skąd ta liczba i ile z niej jest z tej sesji.
     Bez tego licznik trwały stał obok licznika procesu i wyglądał na to samo. */
  .card .s { font-size:11px; color:var(--muted); margin-top:3px; min-height:14px; }
  .card { cursor:help; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px;
           padding:12px 14px; margin-top:12px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em;
              color:var(--muted); margin:0 0 8px; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-weight:500; color:var(--muted); font-size:11px;
       text-transform:uppercase; padding:4px 6px; }
  td { padding:4px 6px; border-top:1px solid var(--line); }
  .empty { color:var(--muted); font-style:italic; padding:6px; }
  button.act { background:var(--accent); color:var(--on-accent); border:none; border-radius:6px;
               padding:7px 14px; cursor:pointer; font-size:13px; }
  button.act.sec { background:none; color:var(--text); border:1px solid var(--line); }
  button.act.danger { color:var(--err); border-color:color-mix(in srgb, var(--err) 45%, var(--line)); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 3px; }
  /* `password` dopisany razem z polem hasła do interfejsu — bez niego pole
     zostawało w domyślnej szerokości przeglądarki i odstawało od reszty. */
  input[type=text], input[type=number], input[type=password], select {
    width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
    background:var(--bg); color:var(--text); font-size:13px; font-family:inherit; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  /* Cel fan-outu: znacznik + znak stacji + operator + PIN + usuwanie. */
  .three { display:grid; grid-template-columns:auto 1fr 1fr 1fr auto auto; gap:8px; align-items:end; }
  .three.off input, .three.off .t-lbl { opacity:.45; }
  /* Znacznik uprawnień przy regule. Trwały, jak plakietka problemów —
     ostrzeżenie, które gaśnie samo, jest gorsze od żadnego. */
  .t-chk { font-size:16px; line-height:32px; cursor:help; user-select:none; }
  .t-chk.bad { color:var(--err); }
  .t-chk.warn { color:var(--warn); }
  .t-chk.ok { color:var(--ok); }
  /* Reguła wyłączona nic nie wysyła, więc jej usterka nie jest pilna —
     znacznik zostaje (po włączeniu zaboli), ale nie krzyczy czerwienią. */
  .t-chk.muted { color:var(--muted); }

  /* Statystyki: paski proporcjonalne do największej wartości w przekroju.
     Same liczby w kolumnie czyta się źle, a wykres byłby przesadą. */
  .range { display:flex; gap:6px; flex-wrap:wrap; }
  /* Zakres dat, oba zawężenia i czyszczenie w JEDNYM rzędzie — to jedna
     decyzja („co pokazujemy"), więc nie ma powodu rozbijać jej na dwa wiersze.
     Każda grupa ma własny podpis, więc kontrolki stoją na jednej linii.
     Bez podpisu nad przyciskami dni rząd wyglądał poszarpany. */
  .st-controls { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; margin:0 0 14px; }
  /* `margin:0` jest tu istotne: globalna reguła `label` dokłada 10px u góry,
     co rozjeżdżało wyrównanie grup w rzędzie. */
  .st-controls .st-group { display:flex; flex-direction:column; gap:4px; margin:0; }
  .st-cap { font-size:11px; color:var(--muted); text-transform:uppercase;
            letter-spacing:.04em; line-height:1.3; }
  /* Jedna wysokość dla list i przycisków — inaczej różnią się o 1–2 px
     i widać to jako drganie linii. */
  .st-controls select { width:auto; min-width:132px; height:32px; box-sizing:border-box; }
  .st-controls .range button, .st-controls > button { height:32px; box-sizing:border-box;
                                                      padding:0 14px; }
  .range button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .st-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
  .st-rows { display:grid; gap:3px; }
  .st-row { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
  .st-bar { position:relative; background:var(--bg); border-radius:4px; overflow:hidden;
            padding:3px 8px; min-width:0; }
  .st-bar span.fill { position:absolute; inset:0 auto 0 0; background:var(--accent); opacity:.16; }
  .st-bar span.lbl { position:relative; white-space:nowrap; overflow:hidden;
                     text-overflow:ellipsis; display:block; }
  .st-num { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }
  .st-num b { color:var(--text); font-variant-numeric:tabular-nums; }

  /* Pytania zadajemy WŁASNYM okienkiem, nie natywnym `confirm`.
     Natywne, blokujące okienko w Electronie na Linuksie po zamknięciu nie
     oddawało ogniska klawiatury rendererowi: kliknięcia dalej działały,
     ale w żadnym polu nie dało się już nic wpisać. Odtworzone 2026-09-04.
     Przy okazji: przyciski są tu przetłumaczone, natywne miały „Ok/Cancel". */
  .ask { position:fixed; inset:0; z-index:60; display:flex; align-items:center;
         justify-content:center; background:rgba(0,0,0,.45); }
  .ask-box { background:var(--panel); border:1px solid var(--line); border-radius:10px;
             padding:18px 20px; max-width:560px; margin:16px;
             box-shadow:0 12px 40px rgba(0,0,0,.35); }
  .ask-text { white-space:pre-wrap; line-height:1.5; }
  .ask-btns { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
  .three.off .t-chk { opacity:.45; }
  /* Znaki wywoławcze zawsze wielkimi literami. CSS daje efekt natychmiast,
     a skrypt podmienia samą wartość pola — inaczej widok i treść by się rozjechały. */
  input.callsign { text-transform:uppercase; }
  input.invalid { border-color:var(--err); }
  /* Wysokość ustawia skrypt (fitLogBox) na podstawie FAKTYCZNEGO położenia
     pola. Wpisana na sztywno rozjeżdżała się przy zawiniętym nagłówku,
     a `flex` na całym układzie powodował przewijanie strony zamiast logu. */
  pre#logbox { background:var(--bg); border:1px solid var(--line); border-radius:6px;
       padding:10px; font-size:12px; overflow:auto; margin:0; min-height:120px;
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap;
       /* Ładunki JSON nie mają spacji, więc samo pre-wrap ich nie złamie
          i log wymaga przewijania w bok. Łamiemy gdziekolwiek. */
       overflow-wrap:anywhere; }
  .lvl-warn{color:var(--warn)} .lvl-error{color:var(--err)}
  /* samodzielna, bo dotąd istniała tylko jako .t-chk.muted */
  .muted { color:var(--muted); }
  .restart-bar { margin:10px 16px 0; border-left-color:var(--warn);
                 display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .restart-bar #restartText { flex:1; min-width:12ch; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  /* Pary „etykieta: wartość" w zakładce O programie. */
  dl.kv { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0; }
  dl.kv dt { color:var(--muted); font-size:12px; }
  dl.kv dd { margin:0; font-size:13px; }
  /* Lista ostatnich zdarzeń. Monospace w czasie, żeby kolumny się nie tańczyły. */
  ul.events { list-style:none; margin:0; padding:0; font-size:13px; }
  ul.events li { padding:3px 0; border-top:1px solid var(--line); display:flex; gap:8px; }
  ul.events li:first-child { border-top:none; }
  ul.events time { color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
                   font-size:12px; flex:none; }
  ul.events .what { flex:1; }
  ul.events li.bad .what { color:var(--err); }
  ul.events li.warn .what { color:var(--warn); }
  ul.events li.dup .what { color:var(--muted); }
  .note { border-left:3px solid var(--warn); padding:8px 10px; background:var(--panel);
          border-radius:0 6px 6px 0; font-size:12px; margin-top:10px; }
</style>
</head>
<body>
<div class="topbar">
<header>
  <span class="dot" id="dot"></span>
  <h1 id="title" data-i18n="app.name">RadioDyplom Bridge</h1>
  <span class="badge" id="profile">—</span>
  <span class="badge dry" id="dryBadge" hidden>DRY-RUN</span>
  <span class="badge st-error" id="probBadge" hidden style="cursor:pointer"></span>
  <span class="badge upd" id="updBadge" hidden style="cursor:pointer"></span>
  <!-- Widoczność w sieci MUSI być widoczna w oknie, ale nie musi krzyczeć:
       duża czerwona plakietka zabierała pół nagłówka. Ikona z dymkiem mówi
       tyle samo, a opis pełny jest w podpowiedzi i na zakładce Stan. -->
  <button class="icon-btn net" id="netIcon" hidden></button>
  <span class="grow"></span>
  <div class="hdr-actions">
    <button class="icon-btn" id="langBtn" title="Język / Language"></button>
    <button class="icon-btn" id="themeBtn" title="Motyw / Theme"></button>
    <button class="act sec" id="btnPause" data-i18n="btn.pause">Wstrzymaj</button>
    <span class="hdr-sep"></span>
    <button class="act sec danger" id="btnQuit" data-i18n="btn.quit" title=""></button>
  </div>
</header>

<!-- Baner „wymaga restartu" siedzi w PRZYKLEJONEJ części okna, więc widać go
     także wtedy, gdy jesteś na dole długiej Konfiguracji przy „Zapisz", i po
     przejściu na inną zakładkę (daemon pamięta, co czeka na restart).
     Dlatego przycisk restartu jest TUTAJ, a nie obok „Zakończ": stały przycisk
     w nagłówku zapraszałby do restartu w trakcie akcji, a restart przerywa
     nasłuch UDP — QSO wysłane w tym okienku nie ma jak wrócić. -->
<div class="note restart-bar" id="restartNote" hidden>
  <span id="restartText"></span>
  <button class="act" id="btnRestart" data-i18n="btn.restart" hidden></button>
</div>

<nav>
  <button data-tab="stan" class="active" data-i18n="tab.state">Stan</button>
  <button data-tab="kolejka" data-i18n="tab.queue">Kolejka</button>
  <button data-tab="konfig" data-i18n="tab.config">Konfiguracja</button>
  <button data-tab="stats" data-i18n="tab.stats">Statystyki</button>
  <button data-tab="log" data-i18n="tab.log">Log</button>
  <button data-tab="about" data-i18n="tab.about">O programie</button>
</nav>
</div>

<main>
  <section id="stan" class="active">
    <div class="cards">
      <div class="card" id="kSent"><div class="k" data-i18n="card.sent"></div><div class="v" id="cSent">0</div><div class="s" id="sSent"></div></div>
      <div class="card" id="kPending"><div class="k" data-i18n="card.pending"></div><div class="v" id="cPending">0</div><div class="s" id="sPending"></div></div>
      <div class="card" id="kFailed"><div class="k" data-i18n="card.failed"></div><div class="v" id="cFailed">0</div><div class="s" id="sFailed"></div></div>
      <div class="card" id="kRecv"><div class="k" data-i18n="card.received"></div><div class="v" id="cRecv">0</div><div class="s" id="sRecv"></div></div>
      <div class="card" id="kSkipped"><div class="k" data-i18n="card.skipped"></div><div class="v" id="cSkipped">0</div><div class="s" id="sSkipped"></div></div>
    </div>
    <div class="panel">
      <h2 data-i18n="panel.account"></h2>
      <div id="accountInfo" class="empty"></div>
    </div>
    <div class="panel">
      <h2 data-i18n="panel.listen"></h2>
      <div id="listenInfo"></div>
      <div class="note" id="localNote" data-i18n="note.localhost" hidden></div>
    </div>
    <div class="panel">
      <h2 data-i18n="panel.willSend"></h2>
      <div id="willSendInfo"></div>
      <div class="note" id="willSendWarn" hidden></div>
    </div>
    <div class="panel">
      <h2 data-i18n="panel.iface"></h2>
      <div id="ifaceInfo"></div>
      <div class="note" id="ifaceNote" hidden></div>
    </div>
    <div class="panel">
      <h2 data-i18n="panel.sources"></h2>
      <div id="sources" class="empty"></div>
    </div>
    <div class="panel">
      <h2 data-i18n="panel.lastEvents"></h2>
      <div id="lastInfo"></div>
    </div>
  </section>

  <section id="kolejka">
    <div class="panel">
      <h2 data-i18n="panel.pending"></h2>
      <table><thead><tr>
        <th data-i18n="th.callsign"></th><th data-i18n="th.station"></th>
        <th data-i18n="th.operator"></th>
        <th data-i18n="th.attempts"></th><th data-i18n="th.error"></th>
      </tr></thead><tbody id="tPending"></tbody></table>
      <div class="empty" id="ePending" data-i18n="empty.queue"></div>
    </div>
    <div class="panel">
      <h2 data-i18n="panel.rejected"></h2>
      <table><thead><tr>
        <th data-i18n="th.callsign"></th><th data-i18n="th.station"></th>
        <th data-i18n="th.operator"></th>
        <th data-i18n="th.attempts"></th><th data-i18n="th.reason"></th>
      </tr></thead><tbody id="tFailed"></tbody></table>
      <div class="empty" id="eFailed" data-i18n="empty.none"></div>
      <div class="hint" data-i18n="hint.requeue"></div>
      <div class="row" style="margin-top:10px">
        <button class="act sec" id="btnRequeue" data-i18n="btn.requeue"></button>
        <button class="act sec" id="btnAckProblems" data-i18n="btn.ackProblems" hidden></button>
        <button class="act sec danger" id="btnDiscardFailed" data-i18n="btn.discardFailed" hidden></button>
      </div>
      <div class="hint" id="ackHint"></div>
    </div>
  </section>

  <section id="konfig">
    <div class="panel">
      <h2 data-i18n="panel.connection"></h2>
      <label data-i18n="label.pin"></label>
      <input type="text" id="fPin" placeholder="ABCD-1234">
      <!-- Identyfikator, bo treść podmieniamy, gdy PIN pochodzi z pin.env. -->
      <div class="hint" id="pinHint" data-i18n="hint.pin"></div>
      <div class="row" style="margin-top:10px">
        <input type="checkbox" id="fDryRun" style="width:auto">
        <label for="fDryRun" style="margin:0" data-i18n="label.dryRun"></label>
      </div>
    </div>

    <div class="panel">
      <h2 data-i18n="panel.udp"></h2>
      <div class="two">
        <div><label data-i18n="label.address"></label>
          <select id="fHost">
            <option value="127.0.0.1" data-i18n="opt.localhost"></option>
            <option value="0.0.0.0" data-i18n="opt.anyhost"></option>
          </select></div>
        <div><label data-i18n="label.port"></label><input type="number" id="fPort"></div>
      </div>
      <label data-i18n="label.multicast"></label>
      <input type="text" id="fMulticast">
      <div class="note" data-i18n="note.anyhost"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="panel.network"></h2>
      <div class="two">
        <div><label data-i18n="label.apiHost"></label>
          <select id="fApiHost">
            <option value="127.0.0.1" data-i18n="opt.apiLocal"></option>
            <option value="0.0.0.0" data-i18n="opt.apiNetwork"></option>
          </select></div>
        <div><label data-i18n="label.apiPort"></label>
          <input type="number" id="fApiPort" min="1024" max="65535"></div>
      </div>
      <label data-i18n="label.apiPassword"></label>
      <input type="password" id="fApiPassword" autocomplete="new-password">
      <label class="chk"><input type="checkbox" id="fApiReadOnly">
        <span data-i18n="label.apiReadOnly"></span></label>
      <div class="note" data-i18n="note.apiNetwork"></div>
      <div class="hint" id="apiNetHint"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="panel.view"></h2>
      <label data-i18n="label.recentEvents"></label>
      <input type="number" id="fEvents" min="5" max="200" step="5">
      <div class="hint" data-i18n="hint.recentEvents"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="panel.fanout"></h2>
      <div id="targets"></div>
      <button class="act sec" id="btnAddTarget" data-i18n="btn.addTarget" style="margin-top:8px"></button>
      <div class="hint" data-i18n="hint.fanout"></div>
    </div>

    <div class="row" style="margin-top:14px">
      <button class="act" id="btnSave" data-i18n="btn.save"></button>
      <span id="saveInfo" class="hint"></span>
    </div>
  </section>

  <section id="stats">
    <div class="panel">
      <h2 data-i18n="panel.statsRange"></h2>
      <div class="st-controls">
        <div class="st-group">
          <span class="st-cap" data-i18n="label.filterRange"></span>
          <div class="range" id="statsRange"></div>
        </div>
        <label class="st-group">
          <span class="st-cap" data-i18n="label.filterOperator"></span>
          <select id="fltOperator"></select>
        </label>
        <label class="st-group">
          <span class="st-cap" data-i18n="label.filterStation"></span>
          <select id="fltStation"></select>
        </label>
        <button class="act sec" id="btnFltClear" data-i18n="btn.filterClear" hidden></button>
      </div>
      <div id="statsTotal" class="empty"></div>
    </div>
    <div id="statsPanels"></div>
  </section>

  <section id="about">
    <div class="panel">
      <h2 data-i18n="panel.about"></h2>
      <div id="aboutInfo"></div>
    </div>
    <div class="panel">
      <h2 data-i18n="panel.license"></h2>
      <div id="licenseInfo"></div>
      <div class="row" style="margin-top:10px">
        <button class="act sec" id="btnLicense" data-i18n="btn.licenseText"></button>
        <button class="act" id="btnUpdate" hidden></button>
      <button class="act sec" id="btnRepo" data-i18n="btn.repo"></button>
        <button class="act sec" id="btnReleases" data-i18n="btn.releases"></button>
      </div>
      <div class="hint" data-i18n="hint.releases"></div>
    </div>
  </section>

  <section id="log">
    <div class="row" style="margin-bottom:10px">
      <button class="act sec" id="btnOpenLog" data-i18n="btn.openLog"></button>
      <!-- Bezpieczna droga do wysłania stanu: PIN-y zamaskowane, hasła brak. -->
      <button class="act sec" id="btnReport" data-i18n="btn.saveReport"></button>
      <div class="hint" id="reportInfo"></div>
      <button class="act sec" id="btnLogEnd" hidden data-i18n="btn.logEnd"></button>
      <span class="hint" id="logFollow" style="margin:0"></span>
      <span class="grow"></span>
      <span class="hint" id="logPath" style="margin:0"></span>
    </div>
    <pre id="logbox"></pre>
  </section>
</main>
<div class="ask" id="ask" hidden>
  <div class="ask-box" role="dialog" aria-modal="true" aria-labelledby="askText">
    <div class="ask-text" id="askText"></div>
    <div class="ask-btns">
      <button class="act sec" id="askNo"></button>
      <!-- Trzecia odpowiedź, ukryta domyślnie: „porzuć zmiany" przy wyjściu
           z niezapisanej konfiguracji. Dwa przyciski nie wystarczą, bo
           „nie zapisuj" i „zostań tutaj" to dwie różne decyzje. -->
      <button class="act sec danger" id="askThird" hidden></button>
      <button class="act" id="askYes"></button>
    </div>
  </div>
</div>

<!-- Most do rdzenia. W Electronie tworzy go preload.cjs i ten plik sam się
     wyłącza; w przeglądarce buduje go z żądań do lokalnego API. Musi być
     PRZED renderer.js. -->
<script src="bridge-http.js"></script>
<script type="module" src="renderer.js"></script>
</body>
</html>
