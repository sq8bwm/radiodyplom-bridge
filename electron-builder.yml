appId: pl.radiodyplom.bridge
productName: RadioDyplom Bridge
copyright: Mostek logger → radiodyplom.pl

directories:
  buildResources: build
  output: release

# Co wchodzi do paczki. Lista jest jawna i wąska z jednego powodu:
# config.json zawiera PIN-y API i NIE MOŻE trafić do dystrybucji.
# Do paczki idzie tylko wzorzec config.example.json, z którego program
# zasiewa konfigurację w katalogu użytkownika przy pierwszym uruchomieniu.
files:
  - src/**/*
  - ui/**/*
  - package.json
  - config.example.json
  - '!**/*.map'
  - '!config.json'
  - '!data/**'
  - '!release/**'
  - '!dist/**'

# Rdzeń nie ma zależności runtime, więc nie ma czego rozpakowywać z asara.
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  # Brak podpisu kodu – patrz README. Windows pokaże ostrzeżenie SmartScreen.

nsis:
  # Bez spacji w nazwie: GitHub zamienia je na kropki przy wgrywaniu załączników,
  # a wtedy SHA256SUMS nie pasuje do tego, co odbiorca pobierze.
  artifactName: radiodyplom-bridge-${version}-setup.${ext}
  oneClick: false                  # użytkownik ma wybrać katalog i skróty
  perMachine: false                # instalacja dla użytkownika = bez UAC
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RadioDyplom Bridge
  # Dane i konfiguracja żyją w %APPDATA%, więc odinstalowanie
  # nie usuwa kolejki ani PIN-ów. Świadoma decyzja: log operatora jest cenniejszy
  # niż czystość odinstalowania.
  deleteAppDataOnUninstall: false

portable:
  artifactName: radiodyplom-bridge-${version}-portable.${ext}

linux:
  artifactName: radiodyplom-bridge-${version}.${ext}
  target:
    - AppImage
    - deb
  # Opiekun pakietu bierze się z pola "author" w package.json.
  # UWAGA: ten adres jest widoczny w metadanych każdego rozdanego .deb
  # (dpkg -I / apt show), więc jest z definicji publiczny.
  icon: build/icon.png
  # UWAGA: sama "HamRadio" NIE wystarczy. Wg specyfikacji freedesktop HamRadio to
  # kategoria dodatkowa i musi jej towarzyszyć kategoria główna (Network albo Audio).
  # Bez tego wpis nie trafia do żadnej gałęzi menu — w XFCE ląduje w koszu
  # "Inne", a przy menu bez sekcji na nieprzypisane znika zupełnie.
  # Sprawdzenie: desktop-file-validate na wygenerowanym .desktop ma milczeć.
  category: Network;HamRadio;
  synopsis: Mostek między loggerem krótkofalarskim a radiodyplom.pl
  # UWAGA: "description" trafia jednocześnie do opisu pakietu i do pola Comment
  # w .desktop, czyli do dymka w menu (electron-builder nadpisuje nim Comment
  # PO scaleniu desktop.entry, więc tam się tego nie da rozdzielić).
  # Dlatego jedno zdanie, a nie akapit — akapit w dymku menu wygląda źle.
  description: >-
    Przekazuje zalogowane QSO z loggera (QLog, N1MM, WSJT-X) na radiodyplom.pl.
  # Nazwa pliku .desktop i StartupWMClass mają się zgadzać z app_id Electrona.
  # Bez tego środowisko graficzne nie kojarzy działającego okna z pozycją w menu
  # (zmierzone: WM_CLASS okna to "radiodyplom-bridge", a nie productName).
  syncDesktopName: true
  desktop:
    entry:
      GenericName: Mostek QSO do radiodyplom.pl
      # Po tym program da się znaleźć wyszukiwarką w GNOME, KDE i Whisker Menu,
      # nawet gdy ktoś nie wie, w której gałęzi menu szukać.
      Keywords: krótkofalarstwo;krotkofalarstwo;hamradio;ham;radio;QSO;log;logger;QLog;N1MM;WSJT-X;JTDX;MSHV;ADIF;dyplom;radiodyplom;
      StartupNotify: 'true'
